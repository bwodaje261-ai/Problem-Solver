<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimited AI Pharmacy Exit Exam & COC Prep</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --bg: #f0fdfa;
            --card: #ffffff;
            --text: #1e293b;
            --correct-bg: #dcfce7;
            --correct-border: #16a34a;
            --wrong-bg: #fee2e2;
            --wrong-border: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; line-height: 1.6; }
        .container { max-width: 850px; margin: 0 auto; }
        header { background: var(--primary); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        header p { font-size: 0.9rem; opacity: 0.9; }

        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.06); margin-bottom: 18px; }
        label { font-weight: bold; display: block; margin-bottom: 6px; color: var(--primary-dark); }
        select, input { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; margin-bottom: 12px; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--primary); color: white; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--primary-dark); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }

        .api-setup { background: #fef3c7; border: 1px solid #f59e0b; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.88rem; }
        .save-btn { padding: 10px 16px; background: #d97706; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 0.95rem; }
        .status-msg { margin-top: 8px; font-weight: bold; font-size: 0.9rem; color: #0f766e; }
        .error-msg { color: #dc2626; margin-top: 10px; font-weight: bold; font-size: 0.92rem; }

        .stats-bar { display: flex; justify-content: space-between; align-items: center; background: #ccfbf1; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; color: #0f766e; }

        .q-box { display: none; }
        .q-domain-badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 6px; font-size: 0.82rem; font-weight: bold; margin-bottom: 10px; }
        .q-text { font-size: 1.08rem; font-weight: 600; margin-bottom: 18px; color: #0f172a; white-space: pre-line; }

        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { text-align: left; padding: 14px; border: 2px solid #e2e8f0; border-radius: 8px; background: white; font-size: 0.98rem; cursor: pointer; transition: 0.2s; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0fdfa; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); color: #14532d; font-weight: 600; }
        .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); color: #7f1d1d; }

        .explanation-box { margin-top: 20px; padding: 16px; border-radius: 10px; background: #f8fafc; border-left: 5px solid var(--primary); display: none; }
        .explanation-box h3 { margin-bottom: 10px; color: var(--primary-dark); font-size: 1.05rem; }
        .exp-item { margin-bottom: 8px; padding: 10px; border-radius: 6px; font-size: 0.92rem; }
        .exp-correct { background: #dcfce7; border: 1px solid #86efac; }
        .exp-wrong { background: #fff1f2; border: 1px solid #fecdd3; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Unlimited AI Pharmacy Exam & COC</h1>
        <p>Infinite Clinical Case & Blueprint Questions with Full Rationales</p>
    </header>

    <div class="card">
        <div class="api-setup" id="apiBox">
            <strong>Gemini API Key:</strong> Paste your free Google Gemini API Key below to unlock unlimited questions:
            <input type="password" id="apiKeyInput" placeholder="Paste API key here..." style="margin-top:8px; margin-bottom:8px;">
            <button type="button" class="save-btn" onclick="saveKey()">Save Key</button>
            <div id="keyStatus" class="status-msg"></div>
        </div>

        <div class="stats-bar">
            <span>Questions Attempted: <span id="qCount">0</span></span>
            <span>Score: <span id="scoreCount">0</span></span>
        </div>

        <label for="domainSelect">Choose Exam Blueprint Domain:</label>
        <select id="domainSelect">
            <option value="Weighted Mix across all Pharmacy Exit Exam domains (Patient Care 53%, Leadership & Supply Chain 14%, Pharm Tech 12%, Law 10%, Professionalism 5%, Scholar 3%, Health Promotion 3%)">All Domains (Weighted National Exam Mix - 100%)</option>
            <option value="Patient Care - Pharmaceutical Care (25%): Pharmacotherapy, clinical cases, lab interpretation, drug interactions">Patient Care: Pharmaceutical Care (25%)</option>
            <option value="Patient Care - Dispensing (21%): Prescription verification, counseling, compounding, dosage calculation">Patient Care: Dispensing (21%)</option>
            <option value="Patient Care - Drug Information Service / DIS (7%): Literature evaluation, toxicology, ADR reporting">Patient Care: DIS (7%)</option>
            <option value="Leadership and Management - Health Commodities Supply Chain Management (12%): ABC/VEN analysis, quantification, cold chain, FEFO, IPLS">Leadership & Supply Chain Management (12%)</option>
            <option value="Leadership and Management - Management/Leadership (2%)">Leadership & Management (2%)</option>
            <option value="Pharmaceutical Technology - Pharmaceutical Development and Manufacturing (11%): Tablet defects, sterilization, biopharmaceutics, GMP">Pharmaceutical Technology & Manufacturing (11%)</option>
            <option value="Pharmaceutical Technology - Drug Discovery (1%)">Drug Discovery (1%)</option>
            <option value="Pharmacy Law and Regulatory Affairs (10%): Institution regulation (4%), Product regulation (4%), Professional regulation (1%), Pharmacy law (1%)">Pharmacy Law & Regulatory Affairs (10%)</option>
            <option value="Professionalism (5%): Ethical principles (2%), Communication & Collaboration (2%), Standards of Conduct (1%)">Professionalism & Ethics (5%)</option>
            <option value="Scholar (3%): Biostatistics, NNT/ARR, study designs, Evidence-Based Medicine">Scholar (3%)</option>
            <option value="Health Promotion and Disease Prevention (3%): Immunization, screening, public health education">Health Promotion & Disease Prevention (3%)</option>
        </select>

        <button type="button" class="btn" id="generateBtn" onclick="generateQuestion()">Generate New Question</button>
        <div id="genError" class="error-msg"></div>
    </div>

    <div class="card q-box" id="questionCard">
        <div class="q-domain-badge" id="qDomainLabel">Domain</div>
        <div class="q-text" id="questionText">Loading...</div>
        <div class="options" id="optionsContainer"></div>

        <div class="explanation-box" id="explanationBox">
            <h3>Detailed Answer & Choice-by-Choice Rationale:</h3>
            <div id="explanationsList"></div>
            <button type="button" class="btn" style="margin-top:15px;" onclick="generateQuestion()">Next Unlimited Question =></button>
        </div>
    </div>
</div>

<script>
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    } catch (e) {}

    let memoryKey = "";
    let totalQuestions = 0;
    let totalScore = 0;
    let previousTopics = [];
    let answeredCurrent = false;

    function getStoredKey() {
        try {
            return localStorage.getItem("gemini_api_key") || memoryKey;
        } catch (e) {
            return memoryKey;
        }
    }

    function setStoredKey(val) {
        memoryKey = val;
        try {
            localStorage.setItem("gemini_api_key", val);
        } catch (e) {}
    }

    window.onload = function() {
        const savedKey = getStoredKey();
        if (savedKey) {
            document.getElementById("apiKeyInput").value = savedKey;
            document.getElementById("keyStatus").innerText = "✅ Key loaded and ready!";
        }
    };

    function saveKey() {
        const key = document.getElementById("apiKeyInput").value.trim();
        const statusEl = document.getElementById("keyStatus");
        if (!key) {
            statusEl.style.color = "#dc2626";
            statusEl.innerText = "⚠️ Please paste your Gemini API Key first!";
            return;
        }
        setStoredKey(key);
        statusEl.style.color = "#0f766e";
        statusEl.innerText = "✅ API Key saved! Click 'Generate New Question' below.";
    }

    async function generateQuestion() {
        const inputVal = document.getElementById("apiKeyInput").value.trim();
        const apiKey = inputVal || getStoredKey();
        const selectedDomain = document.getElementById("domainSelect").value;
        const btn = document.getElementById("generateBtn");
        const qCard = document.getElementById("questionCard");
        const errBox = document.getElementById("genError");

        errBox.innerText = "";

        if (!apiKey) {
            errBox.innerText = "⚠️ Please paste and save your Gemini API Key first.";
